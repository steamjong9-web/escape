<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>엔딩</title><link rel="stylesheet" href="style.css"></head><body><main id="m"></main>
<script>
const S=JSON.parse(localStorage.getItem("ss1")||"null");
if(!S||!S.o){location="index.html"}else{
const E={
true:["🏆 진엔딩 「작은 동조들의 사건」","익명 계정의 주인은 끝내 알 수 없었다. 그건 학생이 찾을 일이 아니라, 신고를 받은 어른과 기관이 확인할 일이다.<br>그날 밤 사건을 멈출 수 있던 순간은 세 번 있었다. 웃음 반응 하나, 전달 한 번, 그리고 스물두 명의 침묵. 그 스물두 명 안에는 우리도 있었다.<br>하루는 월요일 오후 담임 선생님과 상담을 시작했고, 도윤의 캡처는 안전하게 전달되었다.<br><b>작은 행동 하나가 사건을 키우기도, 멈추게 하기도 한다.</b>"],
normal:["🌗 보통 엔딩 「절반의 보고」","진실의 일부는 밝혀졌지만 놓친 것이 있다."],
scape:["📄 엔딩 「한 사람의 이름」","보고서에는 한 사람의 이름이 적혔다. 학교는 그 한 명을 불렀다.<br>하지만 웃음 반응을 누른 열두 명, 읽고 침묵한 스물두 명의 일은 그대로 남았다. 한 사람에게 책임을 모으면 사건이 끝난 것처럼 보이지만, 사건이 생긴 방식은 바뀌지 않는다.<br>되돌아가 다른 선택을 해 볼까?"],
bad:["💔 배드 엔딩 「가장 먼저 손을 내민 사람」","보고서에는 도윤의 이름이 적혔다. 그는 증거를 지키고 하루에게 가장 먼저 연락한 사람이었다.<br>잘못 지목된 사람은 억울함을 풀 길을 잃고, 하루는 아무에게도 말하지 못하게 되었다.<br>되돌릴 수 있었던 순간으로 돌아가 볼까?"],
early:["⚡ 엔딩 「근거 없는 보고」","조사하지 않은 반이 남아 있었다. 근거 없이 올라간 보고서는 소문을 사실처럼 만들었다.<br>두 반의 이야기를 모두 들었다면 달라졌을 것이다."],
timeout:["⏰ 엔딩 「월요일 아침」","시간이 다 되었다. 보고서는 완성되지 못했다. 하지만 오늘 찾은 단서는 사라지지 않는다. 다시 도전해 보자."]};
const f=S.f||{},[t,b]=E[S.o];let miss="";
if(S.o=="normal"){const l=[];if(f.del)l.push("증거를 삭제했다");if(f.stops!=1)l.push("멈출 수 있었던 순간을 모두 찾지 못했다");if(f.help!=1)l.push("하루에게 알맞은 도움을 연결하지 못했다");if(!l.length)l.push("한 가지가 아쉬웠다");miss="<div class=card><b>놓친 부분</b><br>"+l.map(x=>"• "+x).join("<br>")+"</div>"}
const me=f.me?`<div class=card>🌙 그날 밤의 우리: <b>${f.me}</b></div>`:"",left=S.left!=null?`<p>남은 시간 ${Math.floor(S.left/6e4)}분 ${Math.floor(S.left%6e4/1e3)}초 · 단서 ${S.k.length}개</p>`:`<p>단서 ${S.k.length}개</p>`;
document.getElementById("m").innerHTML=`<h2>${t}</h2><p>${b}</p>${miss}${me}${left}<div class=card><b>✍️ 오늘 우리 반이 바꿀 한 가지는?</b><br><textarea style="width:100%;min-height:70px;margin-top:8px;background:#0f1724;color:#e8e2d0;border:1px solid #3b4d70;border-radius:8px;padding:8px;font:inherit"></textarea></div><button class=go onclick="localStorage.removeItem('ss1');location='index.html'">🔄 처음부터 다시</button>`}
</script></body></html>
